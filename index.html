<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="navbar">
            <img id="logo" src="logo.png" alt="">
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Store</li>
                <li>Helps</li>
            </ul>
        </div>
    </nav>
    <div class="main">
        <div class="left-box">
            <div id="brands">
                <h1>Adidas</h1>
                <h1 id="bds">Brands</h1>
            </div>
            
            <div id="span-box">
            <span>Experience the perfect blend of style, comfort, and performance. Adidas shoes are designed to keep you moving with confidence. Upgrade your look with modern designs and premium comfort.</span>
            </div>

            <div id="btn-text">
                <button>Shop Now</button>
                <p>prize-<p id="pz">999</p></p>
            </div>

            <div class="discount">
                <h1>95%-off</h1>
            </div>
        </div>
        <div class="right-box">
            <img id="img" src="shoes-1.png" alt="">
            <div class="arrow-icon">
                <i  class="fa-solid fa-angle-left"></i>
                <i class="fa-solid fa-angle-right"></i>
            </div>
        </div>
    </div> 
    <script src="app.js"></script>
</body>
</html>
